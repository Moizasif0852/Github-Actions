
name: Module 4 - Secrets

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Show variable
        env:
          APP_NAME: ${{ vars.APP_NAME }}
        run: echo "App: $APP_NAME"

      - name: Check secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
          fi

      - name: Check GitHub token
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "Token is available"
